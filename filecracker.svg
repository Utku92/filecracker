  </g>
  <!-- Office doc (middle) -->
  <g>
    <path d="M100 60 h40 l18 18 v82 a6 6 0 0 1 -6 6 h-52 a6 6 0 0 1 -6 -6 v-94 a6 6 0 0 1 6 -6 z" fill="url(#page)"/>
